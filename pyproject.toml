[project]
name = "pfefferminzia-arbeitsstand"
version = "0.1.0"
description = "Arbeitsstand Pfefferminzia fuer Kursteilnehmende: Python-Umgebung fuer Auswertungen des fertigen Datensatzes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=2.0",
    "faker>=30",
    "pyyaml>=6.0",
    "pydantic>=2.8",
    "typer>=0.12",
    "rich>=13",
    "python-dateutil>=2.9",
    "reportlab>=4.2",
    "matplotlib>=3.11.1",
]

[tool.uv]
package = false
