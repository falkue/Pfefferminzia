[project]
name = "pfefferminzia"
version = "0.1.0"
description = "Generator fuer den synthetischen Lehr-Datensatz des fiktiven Versicherers Pfefferminzia"
readme = "src/README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Pfefferminzia Datensatz-Team" }]
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=2.0",
    "faker>=30",
    "pyyaml>=6.0",
    "pydantic>=2.8",
    "typer>=0.12",
    "rich>=13",
    "python-dateutil>=2.9",
]

[project.scripts]
pfefferminzia = "pfefferminzia.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pandera>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pfefferminzia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = []

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008", "E501"]  # B008: typer.Option() als Default; E501: Datenlogik mit langen Zeilen

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]  # Datenlisten
